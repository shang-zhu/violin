[project]
name = "Violin"
version = "0.1.0"
description = "Translate educational videos into 42 languages using Together AI (formerly VideoLingua)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["video", "translation", "dubbing", "tts", "whisper", "together-ai", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.135.2",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "soundfile>=0.13.1",
    "together>=2.5.0",
    "uvicorn>=0.42.0",
]

[project.scripts]
violin = "main:main"
violin-api = "run_api:main"

[project.urls]
Repository = "https://github.com/shang-zhu/Violin"
Issues = "https://github.com/shang-zhu/Violin/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]
