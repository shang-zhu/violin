# Production overrides — premium models (OpenAI translation, ElevenLabs TTS)
# with high per-job ffmpeg parallelism. Jobs are serialized at the API layer
# to keep the ffmpeg multiplier bounded.
# Only fields listed here override default.yaml; everything else inherits.
# Load with:  uvicorn api.main:app  +  CONFIG=config/prod.yaml
# (or wherever the launcher reads the config path).

# ── Concurrency ─────────────────────────────────────────────
# Each ffmpeg process uses ~300MB RAM. Total processes = api.max_workers ×
# merge_video.workers = 1 × 16 = 16 (~4.8GB peak during merge stage).
# merge_video:
#   workers: 4
#   preset: "ultrafast"        # already default — fastest x264 path, lowest CPU

api:
  max_workers: 1             # serialize jobs to avoid the multiplier blowing up RAM
  free_trial_jobs: 1         # jobs allowed per IP without a user-provided API key (0 = unlimited)
  url_upload: false          # don't allow users to paste video URLs (yt-dlp); set true to enable
